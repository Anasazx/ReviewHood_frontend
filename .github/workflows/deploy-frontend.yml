name: Deploy TuniRate Frontend

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: npm ci


      - name: Build Angular
        run: npm run build:ssr


      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: azureuser
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/tunirate
          target: /opt/reviewhood-frontend


      - name: Restart frontend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: azureuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/reviewhood-frontend
            docker compose up -d
            docker compose restart frontend

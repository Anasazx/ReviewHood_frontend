name: Deploy TuniRate Frontend

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: npm ci


      - name: Build Angular
        run: npm run build:ssr


      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          # The key is locked to ~/bin/deploy-frontend.sh, which reads the build from stdin
          tar -C dist/tunirate -czf - . | ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "azureuser@$VPS_HOST"
          rm -f deploy_key

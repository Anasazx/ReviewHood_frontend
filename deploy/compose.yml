# The Angular SSR server. Joins the backend's Docker network so Caddy can reach it; publishes no ports.
# Lives in /opt/reviewhood-frontend next to dist/tunirate. Set BACKEND_NETWORK in .env beside this file.
services:
  frontend:
    image: node:22-alpine
    container_name: reviewhood-frontend
    restart: unless-stopped
    user: node
    working_dir: /app
    command: node server/server.mjs
    environment:
      NODE_ENV: production
      PORT: "4000"
    volumes:
      - ./dist/tunirate:/app:ro
    # Keeps a traffic spike on the website from starving Spring Boot and Postgres
    mem_limit: 512m
    cpus: 1.0
    networks:
      - backend

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK}

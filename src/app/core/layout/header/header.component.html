<header
  class="sticky top-0 z-50 border-b bg-white/95 backdrop-blur transition-shadow duration-200"
  [ngClass]="scrolled ? 'border-slate-200 shadow-[0_4px_20px_-12px_rgba(14,51,25,0.25)]' : 'border-slate-200/70'"
>

  <div
    class="mx-auto flex max-w-7xl items-center gap-3 px-3 transition-[height] duration-200 sm:px-5 lg:gap-6"
    [ngClass]="scrolled ? 'h-14 md:h-16' : 'h-16 md:h-[76px]'"
  >

    <!-- LEFT: MOBILE MENU + LOGO -->
    <div class="flex shrink-0 items-center">

      <!-- BURGER (until the desktop nav links fit) -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="mr-1 rounded-lg p-2 transition hover:bg-slate-100 lg:hidden"
        aria-label="Open menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-slate-700"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <!-- LOGO -->
      <a
        routerLink="/"
        class="flex shrink-0 items-center"
      >
        <img
          src="/logo.png"
          alt="ReviewHood"
          class="w-auto object-contain transition-[height] duration-200"
          [ngClass]="scrolled ? 'h-9 md:h-10' : 'h-10 sm:h-11 md:h-12'"
          loading="eager"
        />
      </a>

    </div>


    <!-- DESKTOP SEARCH: takes the free space between logo and nav, so it shrinks instead of overlapping.
         On the home page it only fades in once the hero search has scrolled away. -->
    <div class="hidden min-w-0 flex-1 justify-center md:flex">
      <div
        class="w-full max-w-md transition duration-200"
        [ngClass]="showHeaderSearch ? 'opacity-100' : 'pointer-events-none invisible -translate-y-1 opacity-0'"
      >
        <app-search-bar></app-search-bar>
      </div>
    </div>


    <!-- DESKTOP NAV -->
    <nav class="hidden shrink-0 items-center gap-1 lg:flex">
      <a
        routerLink="/products"
        routerLinkActive="!bg-brand-50 !text-brand-700"
        class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >Products</a>
      <a
        routerLink="/companies"
        routerLinkActive="!bg-brand-50 !text-brand-700"
        class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >Companies</a>
      <a
        routerLink="/categories"
        routerLinkActive="!bg-brand-50 !text-brand-700"
        class="rounded-full px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >Categories</a>
    </nav>


    <!-- RIGHT SIDE -->
    <div class="ml-auto flex shrink-0 items-center md:ml-0">

      <!-- MOBILE ACTIONS -->
      <div class="flex items-center gap-1 sm:gap-2 md:hidden">

        <!-- MOBILE SEARCH -->
        <button
          type="button"
          (click)="mobileSearchOpen = true"
          class="rounded-full p-2 transition hover:bg-slate-100"
          aria-label="Search"
        >
          <i class="fa-solid fa-magnifying-glass text-lg text-slate-700"></i>
        </button>


        <!-- MOBILE USER -->
        <ng-container
          *ngIf="authService.currentUser$ | async as user; else mobileGuest"
        >

          <a
            routerLink="/account/profile"
            class="rounded-full p-0.5 transition hover:bg-slate-100"
          >
            <app-avatar class="h-9 w-9 text-[2.25rem]" [url]="user.avatarUrl" [name]="user.name" />
          </a>

        </ng-container>


        <!-- MOBILE GUEST -->
        <ng-template #mobileGuest>

          <button
            type="button"
            (click)="openLogin()"
            class="rounded-full bg-brand-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-brand-700"
          >
            Sign in
          </button>

        </ng-template>

      </div>


      <!-- DESKTOP USER MENU -->
      <div class="hidden items-center gap-3 md:flex">

        <!-- LOGGED IN -->
        <ng-container
          *ngIf="authService.currentUser$ | async as user; else desktopGuest"
        >

          <div class="user-menu relative">

            <button
              type="button"
              (click)="toggleUserMenu(); $event.stopPropagation()"
              class="flex items-center gap-2 rounded-full py-1 pl-1 pr-3 transition hover:bg-slate-100"
            >

              <app-avatar class="h-8 w-8 text-[2rem]" [url]="user.avatarUrl" [name]="user.name" />

              <span class="max-w-[140px] truncate text-sm font-semibold text-slate-800">
                {{ user.name }}
              </span>

            </button>


            <!-- USER DROPDOWN -->
            <div
              *ngIf="userMenuOpen"
              class="absolute right-0 top-full z-50 mt-2 w-60 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
            >

              <a
                routerLink="/account"
                class="block px-4 py-2.5 text-sm text-slate-700 transition hover:bg-slate-50"
              >
                My account
              </a>

              <button
                type="button"
                (click)="logoutConfirmOpen = true"
                class="w-full px-4 py-2.5 text-left text-sm text-red-600 transition hover:bg-red-50"
              >
                Logout
              </button>

            </div>

          </div>

        </ng-container>


        <!-- DESKTOP GUEST -->
        <ng-template #desktopGuest>

          <button
            type="button"
            (click)="openLogin()"
            class="rounded-full bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700"
          >
            Log in
          </button>

        </ng-template>

      </div>

    </div>

  </div>


</header>


<!-- MOBILE SIDEBAR (outside <header>: its backdrop-blur would trap this fixed overlay inside the header box) -->
<div class="lg:hidden">
  <app-mobile-sidebar
    [open]="mobileMenuOpen"
    (close)="mobileMenuOpen = false"
  >
  </app-mobile-sidebar>
</div>


<!-- LOGOUT CONFIRMATION MODAL -->
<app-confirm-modal
  *ngIf="logoutConfirmOpen"
  title="Sign out?"
  message="You will need to login again to access your account."
  confirmText="Sign out"
  (cancel)="logoutConfirmOpen = false"
  (confirm)="confirmLogout()"
>
</app-confirm-modal>


<!-- AUTH REQUIRED MODAL -->
<app-auth-required
  *ngIf="showAuthModal"
  (close)="showAuthModal = false"
>
</app-auth-required>


<!-- SUGGEST PRODUCT MODAL -->
<app-suggest-product-modal
  *ngIf="suggestProductOpen"
  (close)="suggestProductOpen = false"
  (submitted)="onSuggestionSubmitted()"
>
</app-suggest-product-modal>



<!-- MOBILE SEARCH -->
<div
  *ngIf="mobileSearchOpen"
  class="fixed left-0 right-0 top-0 z-[200] bg-white md:hidden"
>
  <div class="flex items-center gap-2 border-b border-slate-200 px-3 py-3">

    <!-- BACK -->
    <button
      type="button"
      (click)="mobileSearchOpen = false"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100"
      aria-label="Close search"
    >
      <i class="fa-solid fa-arrow-left text-slate-700"></i>
    </button>

    <!-- SEARCH BAR -->
    <div class="min-w-0 flex-1">
      <app-search-bar variant="mobile"></app-search-bar>
    </div>

  </div>
</div>

<!-- HEADER SEARCH -->
<div *ngIf="variant === 'header'" class="w-full">
  <div class="relative">

    <!-- INPUT -->
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (input)="onInput()"
      (keydown.enter)="goToSearch()"
      placeholder="Search products, brands..."
      autocomplete="off"
      class="w-full rounded-full border border-slate-200 bg-slate-50 py-2.5 pl-4 pr-11 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-600/20"
    />

    <!-- SEARCH BUTTON -->
    <button
      type="button"
      (click)="goToSearch()"
      class="absolute right-1.5 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full text-slate-400 transition hover:bg-slate-200/60 hover:text-brand-600"
    >
      <i class="fa-solid fa-magnifying-glass text-xs"></i>
    </button>


    <!-- SUGGESTIONS -->
    <div
      *ngIf="suggestions.length > 0"
      class="absolute left-0 right-0 top-full z-50 mt-2 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
    >

      <button
        *ngFor="let item of suggestions"
        type="button"
        (click)="selectSuggestion(item)"
        class="flex w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-slate-50"
      >

        <!-- IMAGE -->
        <div
          *ngIf="item.type === 'COMPANY' || item.imageUrl"
          class="flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-full bg-slate-100"
        >

          <img
            *ngIf="item.imageUrl"
            [src]="item.imageUrl | imageUrl"
            [alt]="item.name"
            class="h-full w-full object-cover"
          />

          <i
            *ngIf="!item.imageUrl"
            class="fa-solid"
            [class.fa-building]="item.type === 'COMPANY'"
            [class.fa-box]="item.type === 'PRODUCT'"
            class="text-sm text-slate-400"
          ></i>

        </div>


        <!-- NAME -->
        <div class="min-w-0 flex-1">

          <div class="truncate text-sm font-medium text-slate-800">
            {{ item.name }}
          </div>

          <div class="mt-0.5 text-[11px] font-medium uppercase tracking-wide text-slate-400">
            {{ item.type === 'COMPANY' ? 'Company' : 'Product' }}
          </div>

        </div>


        <!-- ARROW -->
        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-300"></i>

      </button>

    </div>

  </div>

</div>

<!-- HERO SEARCH -->
<div *ngIf="variant === 'hero'" class="relative">

  <div
    class="flex items-center gap-1 rounded-full border border-brand-400/30 bg-white p-1.5 shadow-sm"
  >

    <!-- INPUT -->
    <div class="relative flex-1">

      <i
        class="fa-solid fa-magnifying-glass pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-sm text-brand-400"
      ></i>

      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onInput()"
        (keydown.enter)="goToSearch()"
        placeholder="Search products, brands..."
        autocomplete="off"
        class="w-full rounded-full bg-transparent py-3.5 pl-11 pr-4 text-base text-slate-800 outline-none placeholder:text-slate-400"
      />

    </div>

    <!-- SEARCH BUTTON -->
    <button
      type="button"
      (click)="goToSearch()"
      class="flex-shrink-0 rounded-full bg-brand-600 px-6 py-3.5 text-base font-semibold text-white transition duration-150 hover:bg-brand-700 active:scale-95"
    >
      Search
    </button>

  </div>


  <!-- SUGGESTIONS -->
  <div
    *ngIf="suggestions.length > 0"
    class="absolute left-0 right-0 top-full z-50 mt-2 overflow-hidden rounded-2xl border border-slate-200 bg-white text-left shadow-xl"
  >

    <button
      *ngFor="let item of suggestions"
      type="button"
      (click)="selectSuggestion(item)"
      class="flex w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-slate-50"
    >

      <!-- IMAGE -->
      <div
        *ngIf="item.type === 'COMPANY' || item.imageUrl"
        class="flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-full bg-slate-100"
      >

        <img
          *ngIf="item.imageUrl"
          [src]="item.imageUrl | imageUrl"
          [alt]="item.name"
          class="h-full w-full object-cover"
        />

        <i
          *ngIf="!item.imageUrl"
          class="fa-solid text-sm text-slate-400"
          [class.fa-building]="item.type === 'COMPANY'"
          [class.fa-box]="item.type === 'PRODUCT'"
        ></i>

      </div>


      <!-- NAME -->
      <div class="min-w-0 flex-1">

        <div class="truncate text-sm font-medium text-slate-800">
          {{ item.name }}
        </div>

        <div
          class="mt-0.5 text-[11px] font-medium uppercase tracking-wide text-slate-400"
        >
          {{ item.type === 'COMPANY' ? 'Company' : 'Product' }}
        </div>

      </div>


      <!-- ARROW -->
      <i
        class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-300"
      ></i>

    </button>

  </div>

</div>





<!-- MOBILE SEARCH -->

  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="onInput()"
    (keydown.enter)="goToSearch()"
    placeholder="Search products, brands..."

    autofocus
    class="w-full rounded-full border border-slate-200 bg-slate-50 py-2.5 pl-4 pr-11 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-600/20"

  <button

      </div>

      <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-300"></i>

    </button>

  </div>

</div>

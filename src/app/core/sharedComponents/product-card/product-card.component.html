<article class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white transition-all duration-300 hover:border-brand-400/40 hover:shadow-lg hover:shadow-slate-200/60">

  <!-- IMAGE -->
  <div class="relative aspect-[4/3] overflow-hidden bg-slate-100">
    <img
      [src]="product.imageUrl?.url | imageUrl"
      [alt]="product.name"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"
    />
    <div class="absolute left-3 top-3 inline-flex items-center rounded-lg bg-white/95 px-2.5 py-1 text-[11px] font-medium uppercase tracking-wider text-slate-600 shadow-sm backdrop-blur-sm">
      {{ product.subcategory || 'Other' }}
    </div>
  </div>

  <!-- BODY -->
  <div class="flex flex-1 flex-col p-5">

    <!-- TITLE FIRST — this is what the user scans for, give it top priority -->
    <h2
      class="text-base font-semibold leading-snug text-slate-900 transition hover:text-brand-600 line-clamp-2 cursor-pointer"
      [routerLink]="['/p', product.id]"
    >
      {{ product.name }}
    </h2>

    <!-- COMPANY ROW — its own line, full width, no competing for space with rating -->
    <div *ngIf="showCompany" class="mt-2 flex items-center gap-1.5 min-w-0">
      <img
        [src]="product.companyLogoUrl | imageUrl"
        [alt]="product.companyName"
        class="h-5 w-5 flex-shrink-0 rounded-full border border-slate-200 object-cover"
      >
      <span
        class="truncate text-sm text-slate-500 transition hover:text-brand-600 cursor-pointer"
        [routerLink]="['/c', product.companyId]"
      >
        {{ product.companyName }}
      </span>
      <svg
        *ngIf="product.companyIsVerified"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="h-4 w-4 flex-shrink-0 text-brand-600"
        fill="currentColor"
      >
        <circle cx="12" cy="12" r="10"/>
        <path d="M10 12.5 8.5 11 7 12.5 10 15.5 17 8.5 15.5 7z" fill="white"/>
      </svg>
    </div>

    <!-- DESCRIPTION -->
    <p class="mt-3 text-sm leading-6 text-slate-500 line-clamp-2">
      {{ product.description }}
    </p>

    <p *ngIf="product.description === ''" class="mt-3 text-sm leading-6 text-slate-500">
      No description yet!
    </p>

    <!-- FOOTER: rating + button share the bottom row, rating is now a real anchor point -->
    <div class="mt-auto flex items-center gap-3 pt-5">

      <!-- RATING (fixed width, never competes with anything) -->
      <div
        *ngIf="product.reviewCount > 0; else noReviews"
        class="flex flex-shrink-0 items-center gap-1"
      >
        <i class="fa-solid fa-star text-xs text-rating"></i>
        <span class="text-sm font-semibold text-slate-900">{{ product.reviewsAvg | number:'1.1-1' }}</span>
        <span class="text-xs text-slate-400">({{ product.reviewCount }})</span>
      </div>
      <ng-template #noReviews>
        <span class="flex-shrink-0 text-xs font-medium text-slate-400">No reviews yet</span>
      </ng-template>

      <!-- BUTTON — now shares the row instead of being a full-width slab -->
      <a
      [routerLink]="'/p/' + product.id"
      class="ml-auto inline-flex items-center gap-1.5 rounded-xl bg-ink px-4 py-2.5 text-sm font-medium text-white transition hover:bg-ink-light"
      >
      View details
      </a>

    </div>

  </div>
</article>

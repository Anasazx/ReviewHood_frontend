<section class="mx-auto max-w-7xl px-5 py-10">

  <div class="mb-8">
    <h1 class="text-3xl font-semibold tracking-tight text-slate-900">
      All categories
    </h1>
    <p class="mt-1.5 text-sm text-slate-500">
      Browse every category available on ReviewHood
    </p>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="h-24 animate-pulse rounded-2xl bg-slate-100"></div>
  </div>

  <!-- CATEGORY GRID -->
  <div *ngIf="!loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

    <button
      *ngFor="let subcategory of subcategories"
      (click)="goToCategory(subcategory)"
      class="group flex items-center gap-4 rounded-2xl border border-slate-200/80 bg-white p-5 text-left transition-all duration-300 hover:border-brand-400/40 hover:shadow-lg hover:shadow-slate-200/60"
    >
      <span class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-xl bg-slate-50 text-slate-500 transition group-hover:bg-brand-600/10 group-hover:text-brand-600">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="SUBCATEGORY_ICONS[subcategory.id]"
          />
        </svg>
      </span>

      <div class="min-w-0 flex-1">
        <h3 class="truncate font-semibold text-slate-900 transition group-hover:text-brand-600">
          {{ subcategory.name }}
        </h3>
      </div>

      <i class="fa-solid fa-chevron-right flex-shrink-0 text-xs text-slate-300 transition group-hover:text-brand-600"></i>
    </button>

  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!loading && subcategories.length === 0" class="flex flex-col items-center py-20 text-center">
    <i class="fa-solid fa-shapes mb-4 text-3xl text-slate-300"></i>
    <h2 class="text-lg font-semibold text-slate-900">No categories yet</h2>
    <p class="mt-1 max-w-sm text-sm text-slate-500">
      Check back soon — new categories are added regularly.
    </p>
  </div>

</section>

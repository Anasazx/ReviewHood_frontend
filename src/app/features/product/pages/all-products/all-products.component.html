<section class="mx-auto max-w-7xl px-5 py-10">

  <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight text-slate-900">
        <span *ngIf="selectedSubcategory === 'All'">All products</span>
        <span *ngIf="selectedSubcategory !== 'All'">{{ selectedSubcategory }}</span>
      </h1>
      <p class="mt-1.5 text-sm text-slate-500">
        <span *ngIf="!loading">{{ totalElements }} products</span>
        <span *ngIf="loading">Loading products...</span>
      </p>
    </div>

    <!-- SORT -->
    <select
      [value]="sortBy"
      (change)="setSortBy($any($event.target).value)"
      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none transition focus:border-brand-400/40"
    >
      <option value="relevance">Most relevant</option>
      <option value="rating">Highest rated</option>
      <option value="reviews">Most reviewed</option>
      <option value="newest">Newest first</option>
    </select>
  </div>

  <div class="flex flex-col gap-8 lg:flex-row">

    <!-- FILTERS SIDEBAR -->
    <aside class="flex-shrink-0 lg:w-64">

      <!-- MOBILE TOGGLE -->
      <button
        (click)="showFilters = !showFilters"
        class="mb-4 flex w-full items-center justify-between rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-700 lg:hidden"
      >
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-sliders text-xs"></i>
          Categories
        </span>
        <i class="fa-solid fa-chevron-down text-xs transition-transform" [class.rotate-180]="showFilters"></i>
      </button>

      <div class="space-y-1.5" [class.hidden]="!showFilters" [class.lg:block]="true">

        <button
          (click)="selectSubcategory(null)"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition"
          [class.bg-slate-900]="selectedSubcategory === 'All'"
          [class.text-white]="selectedSubcategory === 'All'"
          [class.text-slate-600]="selectedSubcategory !== 'All'"
          [class.hover:bg-slate-50]="selectedSubcategory !== 'All'"
        >
          All products
        </button>

        <button
          *ngFor="let subcategory of subcategories"
          (click)="selectSubcategory(subcategory)"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition"
          [class.bg-slate-900]="selectedSubcategoryId === subcategory.id"
          [class.text-white]="selectedSubcategoryId === subcategory.id"
          [class.text-slate-600]="selectedSubcategoryId !== subcategory.id"
          [class.hover:bg-slate-50]="selectedSubcategoryId !== subcategory.id"
        >
          <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="SUBCATEGORY_ICONS[subcategory.id] || DEFAULT_SUBCATEGORY_ICON"/>
          </svg>
          {{ subcategory.name }}
        </button>

      </div>
    </aside>

    <!-- RESULTS -->
    <div
      #resultsContainer
      class="min-w-0 flex-1"
      [style.minHeight.px]="lastResultsHeight"
    >
      <!-- INITIAL LOADING -->
      <div *ngIf="loading" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
        <div *ngFor="let i of [1,2,3,4,5,6]" class="h-80 animate-pulse rounded-2xl bg-slate-100"></div>
      </div>

      <!-- PRODUCTS GRID -->
      <div *ngIf="!loading && products.length > 0" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
        <app-product-card
          *ngFor="let product of products"
          [product]="product"
          [showCompany]="true"
        ></app-product-card>
      </div>

      <!-- LOAD MORE -->
      <div *ngIf="!loading && !isLastPage && products.length > 0" class="mt-10 flex justify-center">
        <button
          (click)="loadMore()"
          [disabled]="loadingMore"
          class="inline-flex items-center gap-2 rounded-full border border-slate-200 px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-brand-600/30 hover:text-brand-600 disabled:cursor-not-allowed disabled:opacity-50"
        >
          <i *ngIf="loadingMore" class="fa-solid fa-spinner animate-spin text-xs"></i>
          <span *ngIf="!loadingMore">Load more products</span>
          <span *ngIf="loadingMore">Loading...</span>
        </button>
      </div>

      <!-- END OF LIST -->
      <p *ngIf="!loading && isLastPage && products.length > 0" class="mt-10 text-center text-sm text-slate-400">
        You've reached the end · {{ products.length }} of {{ totalElements }} products
      </p>

      <!-- EMPTY STATE -->
      <div *ngIf="!loading && products.length === 0" class="flex flex-col items-center py-20 text-center">
        <i class="fa-solid fa-box-open mb-4 text-3xl text-slate-300"></i>
        <h2 class="text-lg font-semibold text-slate-900">No products found</h2>
        <p class="mt-1 max-w-sm text-sm text-slate-500">
          There are no products in this category yet.
        </p>
      </div>

    </div>

  </div>

</section>

<div class="w-full">
  <div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5">

      <!-- VIEW MODE -->
      <ng-container *ngIf="myReview && !editing">

        <div class="flex items-center justify-between mb-4">

          <h3 class="text-base font-bold text-slate-900">
            Your Review
          </h3>

        </div>


        <!-- Rating -->
        <div class="flex items-center gap-1 mb-4">

          <div class="flex gap-0.5 text-xl">
      <span
        *ngFor="let i of [1,2,3,4,5]"
        [class.text-rating]="i <= selectedRating"
        [class.text-slate-200]="i > selectedRating">
        ★
      </span>
          </div>

          <span class="text-xs text-gray-400 ml-1">
      {{ selectedRating }}/5
    </span>

        </div>


        <!-- Review content -->
        <div
          class="bg-slate-50 rounded-xl p-3 mb-5 border border-slate-100">

          <p class="text-sm text-gray-600 leading-relaxed">
            {{ reviewContent || 'No written review.' }}
          </p>

        </div>


        <!-- Actions -->
        <button
          type="button"
          (click)="startEdit()"
          class="w-full rounded-xl
           bg-brand-600
           py-2.5
           text-sm
           font-semibold
           text-white
           hover:bg-brand-700
           transition
           flex items-center justify-center gap-2">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.5-9.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/>

          </svg>

          Edit Review

        </button>


      </ng-container>

      <!-- CREATE / EDIT MODE -->
      <ng-container *ngIf="!myReview || editing">


        <h3 class="text-base font-bold text-slate-900 mb-0.5">
          {{ reviewFormTitle }}
        </h3>


        <p class="text-xs text-gray-400 mb-5">

          <ng-container *ngIf="myReview">
            Edit your existing review below.
          </ng-container>

          <ng-container *ngIf="!myReview">
            One review per product — make it count!
          </ng-container>

        </p>



        <form (submit)="submit(); $event.preventDefault()">



          <!-- Rating -->
          <div class="mb-4">

            <label class="block text-xs font-medium text-gray-600 mb-1.5">
              Rating
            </label>


            <div class="flex items-center gap-0.5"
                 (mouseleave)="hoveredRating = 0">


              <span
                *ngFor="let i of [1,2,3,4,5]"
                class="text-2xl cursor-pointer select-none transition-transform duration-100 hover:scale-110"
                (mouseenter)="hoveredRating = i"
                (click)="selectedRating = i"
                [class.text-rating]="i <= (hoveredRating || selectedRating)"
                [class.text-slate-200]="i > (hoveredRating || selectedRating)">
                ★
              </span>


            </div>



            <p class="text-xs text-gray-400 mt-1 h-4">

              <ng-container [ngSwitch]="hoveredRating || selectedRating">

                <span *ngSwitchCase="1">Terrible</span>
                <span *ngSwitchCase="2">Poor</span>
                <span *ngSwitchCase="3">Okay</span>
                <span *ngSwitchCase="4">Good</span>
                <span *ngSwitchCase="5">Excellent!</span>

              </ng-container>

            </p>


          </div>




          <!-- Content -->
          <div class="mb-4">

            <label class="block text-xs font-medium text-gray-600 mb-1.5">
              Review
            </label>


            <textarea
              name="reviewContent"
              [(ngModel)]="reviewContent"
              rows="4"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-600/40 focus:bg-white transition-all resize-none"
              placeholder="What did you think?">
            </textarea>


          </div>




          <!-- Buttons -->
          <div class="flex gap-2">


            <button
              type="submit"
              [disabled]="submittingReview || selectedRating === 0 || !hasChanges"
              class="flex-1 rounded-xl bg-brand-600 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 transition disabled:opacity-40 disabled:cursor-not-allowed">

              {{ reviewFormButtonLabel }}

            </button>



            <button
              *ngIf="myReview"
              type="button"
              (click)="cancelEdit()"
              class="px-4 rounded-xl border border-slate-200 text-sm font-medium text-gray-600 hover:bg-gray-50">

              Cancel

            </button>


          </div>


        </form>


      </ng-container>

    </div>
  </div>
</div>

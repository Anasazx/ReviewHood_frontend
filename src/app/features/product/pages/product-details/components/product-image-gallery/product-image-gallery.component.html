<div class="w-full" (keydown.arrowLeft)="prevImage()" (keydown.arrowRight)="nextImage()">
  <div class="group relative aspect-square overflow-hidden rounded-2xl border border-slate-100 bg-slate-50">

    @if (selectedImage) {
      <img [src]="selectedImage | imageUrl" [alt]="name || 'Product image'" class="h-full w-full object-cover" />
    } @else {
      <!-- No image: branded placeholder instead of an empty gray box -->
      <div class="flex h-full w-full flex-col items-center justify-center gap-2 text-slate-300" aria-hidden="true">
        <i class="fa-regular fa-image text-5xl"></i>
        <span class="text-xs font-medium text-slate-400">No image yet</span>
      </div>
    }

    @if (images.length > 1) {
      <!-- Always visible on touch screens, revealed on hover with a mouse -->
      <button type="button" (click)="prevImage()" aria-label="Previous image"
              class="absolute left-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-slate-700 shadow-sm transition hover:bg-white sm:opacity-0 sm:group-hover:opacity-100 sm:focus:opacity-100">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>
      <button type="button" (click)="nextImage()" aria-label="Next image"
              class="absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-slate-700 shadow-sm transition hover:bg-white sm:opacity-0 sm:group-hover:opacity-100 sm:focus:opacity-100">
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
      <div class="absolute bottom-2 right-2 rounded-full bg-black/55 px-2 py-0.5 text-[11px] font-medium text-white">
        {{ currentImageIndex + 1 }} / {{ images.length }}
      </div>
    }
  </div>

  @if (images.length > 1) {
    <div class="mt-3 flex gap-2 overflow-x-auto pb-1">
      @for (image of images; track image.id; let i = $index) {
        <button type="button" (click)="currentImageIndex = i" [attr.aria-label]="'Show image ' + (i + 1)"
                [attr.aria-current]="i === currentImageIndex"
                class="h-16 w-16 shrink-0 overflow-hidden rounded-xl border-2 bg-slate-50 transition"
                [ngClass]="i === currentImageIndex ? 'border-brand-600' : 'border-transparent opacity-70 hover:opacity-100'">
          <img [src]="image.url | imageUrl" alt="" class="h-full w-full object-cover" />
        </button>
      }
    </div>
  }
</div>

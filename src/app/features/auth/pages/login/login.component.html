<div class="mx-auto w-full max-w-md px-6 py-8 mt-16">


<!-- Header -->
<div class="mb-7 text-center">

  <h1 class="text-2xl font-bold tracking-tight text-slate-900">
    Welcome back
  </h1>

  <p class="mt-2 text-sm text-slate-500">
    Sign in to continue to your account.
  </p>

</div>


<!-- Login Form -->
<form
  (submit)="onSubmit(email.value, password.value, $event)"
  class="space-y-5"
>

  <!-- Email -->
  <div>

    <label
      for="login-email"
      class="mb-2 block text-sm font-medium text-slate-700"
    >
      Email address
    </label>

    <input
      #email
      type="email"
      id="login-email"
      name="email"
      placeholder="you@example.com"
      required
      autocomplete="email"
      class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
    />

  </div>


  <!-- Password -->
  <div>

    <div class="mb-2 flex items-center justify-between">

      <label
        for="login-password"
        class="text-sm font-medium text-slate-700"
      >
        Password
      </label>

      <button
        type="button"
        class="text-sm font-medium text-brand-600 transition-colors hover:text-brand-700"
      >
        Forgot password?
      </button>

    </div>


    <div class="relative">

      <input
        #password
        [type]="showPassword ? 'text' : 'password'"
        id="login-password"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
      />


      <!-- Password Toggle -->
      <button
        type="button"
        (click)="showPassword = !showPassword"
        class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
        aria-label="Toggle password visibility"
      >

        <!-- Eye -->
        <svg
          *ngIf="!showPassword"
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
          />
        </svg>


        <!-- Eye Off -->
        <svg
          *ngIf="showPassword"
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.132-3.592m3.038-2.408A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-4.132 5.411M15 12a3 3 0 11-6 0 3 3 0 016 0zM3 3l18 18"
          />
        </svg>

      </button>

    </div>

  </div>


  <!-- Error -->
  <div
    *ngIf="error"
    class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
  >
    {{ error }}
  </div>


  <!-- Login Button -->
  <button
    type="submit"
    [disabled]="loading"
    class="w-full rounded-xl bg-ink px-4 py-3 font-semibold text-white transition-all duration-200 hover:bg-ink-light focus:outline-none focus:ring-4 focus:ring-ink/15 disabled:cursor-not-allowed disabled:opacity-60"
  >

    <span
      *ngIf="!loading"
      class="flex items-center justify-center"
    >
      Sign in
    </span>

    <span
      *ngIf="loading"
      class="flex items-center justify-center gap-2"
    >

      <svg
        class="h-4 w-4 animate-spin"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>

        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
        ></path>

      </svg>

      Signing in…

    </span>

  </button>

</form>


<!-- Divider -->
<div class="my-6 flex items-center gap-4">

  <div class="h-px flex-1 bg-slate-200"></div>

  <span class="text-xs font-medium uppercase tracking-wide text-slate-400">
    Or
  </span>

  <div class="h-px flex-1 bg-slate-200"></div>

</div>


<!-- Google Login -->
<div class="flex justify-center">

  <asl-google-signin-button
    type="standard"
    size="large"
  ></asl-google-signin-button>

</div>


<!-- Register -->
<p class="mt-6 text-center text-sm text-slate-500">

  Don't have an account?

  <a
    routerLink="/auth/register"
    class="font-semibold text-brand-600 transition-colors hover:text-brand-700"
  >
    Sign up
  </a>

</p>


</div>

<div class="mx-auto w-full max-w-md px-6 py-8 mt-16">

  <!-- Header -->
  <div class="mb-7 text-center">

    <h1 class="text-2xl font-bold tracking-tight text-slate-900">
      Create your account
    </h1>

    <p class="mt-2 text-sm text-slate-500">
      Join ReviewHood and start sharing your opinions.
    </p>

  </div>


  <!-- Register Form -->
  <form
    (submit)="onSubmit(username.value, email.value, password.value, confirmPassword.value, $event)"
    class="space-y-5"
  >

    <!-- Username -->
    <div>

      <label
        for="register-username"
        class="mb-2 block text-sm font-medium text-slate-700"
      >
        Username
      </label>

      <input
        #username
        type="text"
        id="register-username"
        name="username"
        placeholder="your username"
        required
        autocomplete="username"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
      />

    </div>


    <!-- Email -->
    <div>

      <label
        for="register-email"
        class="mb-2 block text-sm font-medium text-slate-700"
      >
        Email address
      </label>

      <input
        #email
        type="email"
        id="register-email"
        name="email"
        placeholder="you@example.com"
        required
        autocomplete="email"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
      />

    </div>


    <!-- Password -->
    <div>

      <label
        for="register-password"
        class="mb-2 block text-sm font-medium text-slate-700"
      >
        Password
      </label>

      <div class="relative">

        <input
          #password
          [(ngModel)]="passwordValue"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          id="register-password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
        />

        <button
          type="button"
          (click)="showPassword = !showPassword"
          class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
          aria-label="Toggle password visibility"
        >

          <!-- Eye -->
          <svg
            *ngIf="!showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>

          <!-- Eye Off -->
          <svg
            *ngIf="showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.132-3.592m3.038-2.408A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 014.132 5.411M15 12a3 3 0 11-6 0 3 3 0 016 0zM3 3l18 18"
            />
          </svg>

        </button>

      </div>

    </div>


    <!-- Confirm Password -->
    <div>

      <label
        for="register-confirm-password"
        class="mb-2 block text-sm font-medium text-slate-700"
      >
        Confirm password
      </label>

      <div class="relative">

        <input
          #confirmPassword
          [(ngModel)]="confirmPasswordValue"
          name="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          id="register-confirm-password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-slate-900 outline-none transition-all duration-200 placeholder-slate-400 focus:border-brand-600 focus:ring-4 focus:ring-brand-600/10"
        />

        <button
          type="button"
          (click)="showPassword = !showPassword"
          class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
          aria-label="Toggle password visibility"
        >

          <!-- Eye -->
          <svg
            *ngIf="!showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>

          <!-- Eye Off -->
          <svg
            *ngIf="showPassword"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.132-3.592m3.038-2.408A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 014.132 5.411M15 12a3 3 0 11-6 0 3 3 0 016 0zM3 3l18 18"
            />
          </svg>

        </button>

      </div>


      <!-- Password Match -->
      <p
        *ngIf="confirmPasswordValue && passwordValue !== confirmPasswordValue"
        class="mt-2 text-sm text-red-600"
      >
        Passwords do not match.
      </p>

      <p
        *ngIf="confirmPasswordValue && passwordValue === confirmPasswordValue"
        class="mt-2 text-sm text-green-600"
      >
        Passwords match.
      </p>

    </div>


    <!-- Error -->
    <div
      *ngIf="error"
      class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ error }}
    </div>


    <!-- Create Account Button -->
    <button
      type="submit"
      [disabled]="loading"
      class="w-full rounded-xl bg-ink px-4 py-3 font-semibold text-white transition-all duration-200 hover:bg-ink-light focus:outline-none focus:ring-4 focus:ring-ink/15 disabled:cursor-not-allowed disabled:opacity-60"
    >

      <span
        *ngIf="!loading"
        class="flex items-center justify-center"
      >
        Create account
      </span>

      <span
        *ngIf="loading"
        class="flex items-center justify-center gap-2"
      >

        <svg
          class="h-4 w-4 animate-spin"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>

          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
          ></path>

        </svg>

        Creating account…

      </span>

    </button>

  </form>


  <!-- Sign In -->
  <p class="mt-6 text-center text-sm text-slate-500">

    Already have an account?

    <a
      routerLink="/auth/login"
      class="font-semibold text-brand-600 transition-colors hover:text-brand-700"
    >
      Sign in
    </a>

  </p>


</div>

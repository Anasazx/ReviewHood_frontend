<div class="space-y-6">

  <!-- HEADER -->
  <div>
    <h2 class="text-lg font-semibold text-gray-800">My Reviews</h2>
    <p class="text-sm text-gray-500">
      All reviews you’ve written
    </p>
  </div>

  <!-- REVIEWS LIST -->
  <div class="space-y-4">

    <!-- EMPTY STATE -->
    <div *ngIf="!loading && !reviews?.length" class="text-center py-10 border rounded-xl">
      <p class="text-gray-500 text-sm">
        You haven’t written any reviews yet.
      </p>
    </div>

    <!-- REVIEW ITEM -->
    <div
      *ngFor="let review of reviews"
      class="border rounded-xl p-4 space-y-2 hover:shadow-sm transition">

      <!-- TOP -->
      <div class="flex justify-between items-start">

        <div>
          <p class="font-medium text-gray-800 cursor-pointer hover:underline hover:text-gray-900 transition" [routerLink]="['/p', review.productId]">
            {{ review.productName }}
          </p>

          <p class="text-xs text-gray-500">
            {{ review.createdAt | date:'mediumDate' }}
          </p>
        </div>

        <!-- RATING -->
        <div class="text-rating text-sm font-medium">
          ★ {{ review.rating }}/5
        </div>

      </div>

      <!-- CONTENT -->
      <p class="text-sm text-gray-600">
        {{ review.content }}
      </p>

    </div>

    <div #loadMoreTrigger></div>

  </div>

  <div class="flex justify-center divide-gray-400" *ngIf="loading">Loading reviews...</div>

</div>

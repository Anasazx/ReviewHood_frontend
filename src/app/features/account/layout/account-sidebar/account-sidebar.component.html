<!-- LEFT SIDEBAR -->
<div
  *ngIf="authService.currentUser$ | async as user"
  class="
    h-full
    bg-white
    border
    border-gray-200
    rounded-2xl
    p-5
    shadow-sm
  ">

  <!-- USER -->
  <div class="flex flex-col items-center text-center">

    <img
      [src]="user.avatarUrl | imageUrl"
      class="w-20 h-20 rounded-full border-2 border-gray-200 object-cover shadow-sm" />

    <h2 class="mt-3 text-lg font-semibold text-gray-800">
      {{ user.name }}
    </h2>

    <p class="text-sm text-gray-500">
      Account Settings
    </p>

  </div>

  <hr class="my-5">

  <!-- MENU -->
  <nav class="space-y-2">

    <!-- PROFILE -->
    <a
      routerLink="/account/profile"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition">

      <i class="fa-regular fa-user text-gray-500 w-5 text-center"></i>
      <span>Profile</span>

    </a>

    <!-- REVIEWS -->
    <a
      routerLink="/account/reviews"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition">

      <i class="fa-regular fa-star text-gray-500 w-5 text-center"></i>
      <span>Reviews</span>

    </a>
    <a
      routerLink="/account/suggestions"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      (click)="close()"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition">

      <i class="fa-regular fa-lightbulb text-gray-500 w-5 text-center"></i>

      <span>Suggestions</span>

    </a>
    <!--

    <a
      routerLink="/account/comments"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition">

      <i class="fa-regular fa-comment text-gray-500 w-5 text-center"></i>
      <span>My Comments</span>

    </a>
-->
    <!-- SECURITY -->
    <!--
    <a
      routerLink="/account/security"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 transition">

      <i class="fa-solid fa-shield-halved text-gray-500 w-5 text-center"></i>
      <span>Security</span>

    </a>
    -->
  </nav>

</div>

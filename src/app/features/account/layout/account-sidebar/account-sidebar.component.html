<nav aria-label="Account"
     class="flex gap-1 overflow-x-auto px-4 [scrollbar-width:none] md:flex-col md:overflow-visible md:px-0 [&::-webkit-scrollbar]:hidden">

  @for (item of items; track item.path) {
    <a [routerLink]="item.path"
       routerLinkActive="!bg-white !text-brand-700 shadow-sm ring-1 ring-slate-200"
       #rla="routerLinkActive"
       class="flex shrink-0 items-center gap-2.5 whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-slate-900 md:rounded-xl md:py-2.5">
      <i class="fa-solid w-4 text-center text-[13px]" [ngClass]="[item.icon, rla.isActive ? 'text-brand-600' : 'text-slate-400']"></i>
      {{ item.label }}
    </a>
  }

  <div class="hidden md:my-3 md:block md:border-t md:border-slate-200"></div>

  <button type="button" (click)="logoutConfirmOpen = true"
          class="flex shrink-0 items-center gap-2.5 whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium text-slate-500 transition hover:bg-red-50 hover:text-red-600 md:rounded-xl md:py-2.5">
    <i class="fa-solid fa-arrow-right-from-bracket w-4 text-center text-[13px]"></i>
    Log out
  </button>
</nav>

@if (logoutConfirmOpen) {
  <app-confirm-modal
    title="Log out?"
    message="You will need to log in again to access your account."
    confirmText="Log out"
    (cancel)="logoutConfirmOpen = false"
    (confirm)="logout()">
  </app-confirm-modal>
}

<!-- Same header as the rest of the site, so navigation and the user menu stay familiar -->
<app-header></app-header>

<div class="min-h-[calc(100vh-64px)] bg-slate-50">
  <div class="mx-auto max-w-6xl px-4 py-6 md:py-10">

    <!-- GREETING -->
    @if (authService.currentUser$ | async; as user) {
      <div class="mb-6 flex items-center gap-4 md:mb-8">
        <app-avatar class="h-12 w-12 text-[3rem] md:h-14 md:w-14 md:text-[3.5rem]" [url]="user.avatarUrl" [name]="user.name" />
        <div class="min-w-0">
          <h1 class="truncate text-xl font-semibold tracking-tight text-ink md:text-2xl">{{ user.name }}</h1>
          <p class="text-sm text-slate-500">Your account</p>
        </div>
      </div>
    }

    <div class="flex flex-col gap-5 md:flex-row md:items-start md:gap-8">

      <!-- NAV: vertical list on desktop, swipeable tabs on mobile -->
      <aside class="-mx-4 shrink-0 md:sticky md:top-24 md:mx-0 md:w-56">
        <app-account-sidebar></app-account-sidebar>
      </aside>

      <!-- CONTENT -->
      <main class="min-w-0 flex-1">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 md:p-7">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>
  </div>
</div>

<app-toast></app-toast>
